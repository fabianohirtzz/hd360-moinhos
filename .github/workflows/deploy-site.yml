name: Publicar arquivos do site

# Sobe para a ErêHost os arquivos informados (caminhos relativos à raiz do repo,
# separados por espaço), usando os mesmos secrets de FTP do blog.
on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Arquivos para publicar, separados por espaço (ex.: blog.html .htaccess)'
        required: true

permissions:
  contents: read

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publicar na hospedagem (ErêHost, FTP)
        timeout-minutes: 15
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FILES: ${{ inputs.files }}
        run: node tools/blog-migration/deploy-ftp.mjs --files $FILES
